    function selectOutfit(btn, label, outfitKey, bonusText) {
      currentOutfit.label = label;
      currentOutfit.key = outfitKey;

      }

      var opts = document.querySelectorAll('.outfit-opt');
      for (var i = 0; i < opts.length; i++) {
        opts[i].className = 'outfit-opt flex flex-col items-center gap-gutter-xs p-gutter-sm rounded-xl border-2 border-slate-300 bg-light-surface-bright cursor-pointer';
        var st = opts[i].querySelector('.outfit-status');
        if (st) {
          st.className = 'outfit-status px-gutter-sm py-gutter-xs rounded-full bg-dock-bg text-ink-dark font-headline text-label-sm';
          st.textContent = 'Milikmu';
        }
      }
      btn.className = 'outfit-opt flex flex-col items-center gap-gutter-xs p-gutter-sm rounded-xl border-2 border-success bg-dock-bg cursor-pointer';
      var activeSt = btn.querySelector('.outfit-status');
      if (activeSt) {
        activeSt.className = 'outfit-status px-gutter-sm py-gutter-xs rounded-full bg-success text-light-surface-bright font-headline text-label-sm';
        activeSt.textContent = 'Dipakai';
      }
    }

    function saveOutfit() {
      try {
        var existing = {};
        var raw = localStorage.getItem('mb_character');
        if (raw) existing = JSON.parse(raw) || {};
        existing.outfitLabel = currentOutfit.label;
        existing.outfitKey = currentOutfit.key;
        localStorage.setItem('mb_character', JSON.stringify(existing));
      } catch (e) {}
      var toast = document.getElementById('save-toast');
      toast.classList.remove('hidden');
      setTimeout(function () { toast.classList.add('hidden'); }, 2200);

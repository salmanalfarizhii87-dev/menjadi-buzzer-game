        <svg class="w-6 h-6" viewBox="0 0 28 28" fill="none" aria-hidden="true">
          <circle cx="14" cy="14" r="9" fill="#FFFFFF"></circle>
          <text x="14" y="17.5" text-anchor="middle" fill="#4D7C0F" font-family="Fredoka, sans-serif" font-weight="700" font-size="10">Rp</text>
        </svg>
      </a>
    </nav>

  </div>

  <script>
    (function () {
      var balanceEl = document.getElementById('hud-balance');
      var rateEl = document.getElementById('hud-rate');
      var balance = 500;
      var rate = 12;

      try {
        var saved = localStorage.getItem('mb_mvp_balance');
        if (saved && !isNaN(parseFloat(saved))) {
          balance = parseFloat(saved);
        }
        var savedRate = localStorage.getItem('mb_mvp_rate');
        if (savedRate && !isNaN(parseFloat(savedRate))) {
          rate = parseFloat(savedRate);
        }
      } catch (e) {}

      function render() {
        balanceEl.textContent = 'Rp ' + Math.floor(balance).toLocaleString('id-ID');
        rateEl.textContent = '+Rp ' + rate.toLocaleString('id-ID') + '/dtk';
      }

      render();
      setInterval(function () {
        balance += rate * 0.5;
        render();
        try {
          localStorage.setItem('mb_mvp_balance', String(Math.floor(balance)));
        } catch (e) {}
      }, 500);
    })();
  </script>
